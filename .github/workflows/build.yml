name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build (Geant4 11.3.2 + OpenTOPAS 4.3.0) + regression suite (${{ matrix.os }})
    # Runner images are pinned rather than ubuntu-latest, so an image change is a
    # deliberate edit here. 24.04 has GCC 13, 26.04 has GCC 15.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      G4_TAG: v11.3.2
      TOPAS_TAG: v4.3.0
      GDCM_TAG: v2.6.8
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libexpat1-dev zlib1g-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxt-dev xorg-dev \
            qtbase5-dev qtbase5-dev-tools qt5-qmake libqt5opengl5-dev \
            ripgrep python3-venv

      - name: Cache Geant4 install
        id: g4cache
        uses: actions/cache@v4
        with:
          path: ~/geant4-install
          key: geant4-${{ env.G4_TAG }}-install-${{ matrix.os }}

      - name: Build Geant4 from source
        if: steps.g4cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --branch "$G4_TAG" --depth 1 https://github.com/Geant4/geant4 ~/geant4-src
          cmake -S ~/geant4-src -B ~/geant4-build \
            -DGEANT4_INSTALL_DATA=ON \
            -DGEANT4_BUILD_MULTITHREADED=ON \
            -DGEANT4_USE_QT=ON \
            -DGEANT4_USE_OPENGL_X11=OFF \
            -DGEANT4_USE_SYSTEM_ZLIB=ON \
            -DCMAKE_INSTALL_PREFIX="$HOME/geant4-install"
          cmake --build ~/geant4-build --target install -j "$(nproc)"

      # GDCM 2.6.8's own CMakeLists.txt sets policies (CMP0022, CMP0026) that
      # recent CMake refuses to honor. Rather than patch a third-party build
      # system, configure it with a pinned older CMake in a throwaway venv --
      # see docs/building_gdcm.md.
      - name: Cache GDCM install
        id: gdcmcache
        uses: actions/cache@v4
        with:
          path: ~/gdcm-install
          key: gdcm-${{ env.GDCM_TAG }}-install-${{ matrix.os }}

      - name: Build GDCM from source (if not cached)
        if: steps.gdcmcache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          python3 -m venv ~/oldcmake
          ~/oldcmake/bin/pip install "cmake==3.27.*"
          git clone --branch "$GDCM_TAG" --depth 1 https://github.com/malaterre/GDCM ~/gdcm-src
          ~/oldcmake/bin/cmake -S ~/gdcm-src -B ~/gdcm-build \
            -DGDCM_BUILD_SHARED_LIBS=ON \
            -DGDCM_BUILD_DOCBOOK_MANPAGES=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/gdcm-install"
          ~/oldcmake/bin/cmake --build ~/gdcm-build --target install -j "$(nproc)"

      - name: Build OpenTOPAS (patched) with this extension
        run: |
          set -euxo pipefail
          git clone --branch "$TOPAS_TAG" --depth 1 https://github.com/OpenTOPAS/OpenTOPAS ~/OpenTOPAS
          git -C ~/OpenTOPAS apply "$GITHUB_WORKSPACE/patches/0001-opentopas-harden-dicom-activity-map.patch"
          cmake -S ~/OpenTOPAS -B ~/topas-build \
            -DCMAKE_INSTALL_PREFIX="$HOME/topas-install" \
            -DTOPAS_EXTENSIONS_DIR="$GITHUB_WORKSPACE" \
            -DGeant4_DIR="$HOME/geant4-install/lib/cmake/Geant4" \
            -DGDCM_DIR="$HOME/gdcm-install/lib/gdcm-2.6" \
            -DTOPAS_USE_QT=ON
          cmake --build ~/topas-build --target install -j "$(nproc)"
          test -x "$HOME/topas-install/bin/topas"

      - name: Regression suite
        run: |
          set -euxo pipefail
          source "$HOME/geant4-install/bin/geant4.sh"
          export LD_LIBRARY_PATH="$HOME/topas-install/lib:$HOME/geant4-install/lib:$HOME/gdcm-install/lib:${LD_LIBRARY_PATH:-}"
          # geant4.sh only sets GEANT4_DATA_DIR; the per-dataset variables TOPAS
          # checks for are left commented out. geant4-config lists each dataset as
          # "name variable path", so this follows the Geant4 version without
          # hard-coding dataset versions.
          while read -r _name var path; do
            export "$var=$path"
          done < <("$HOME/geant4-install/bin/geant4-config" --datasets)
          bash tests/regtests/validate_all_features_vs_legacy.sh "$HOME/topas-install/bin/topas"

      - name: Show TOPAS run logs (on failure)
        if: failure()
        run: |
          for f in /tmp/validate_*.log $(find /tmp -name run.log -mmin -120 2>/dev/null); do
            echo "::group::$f"
            tail -n 60 "$f" || true
            echo "::endgroup::"
          done

      - name: Upload test outputs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regtest-logs-${{ matrix.os }}
          path: |
            /tmp/validate_*.log
            /tmp/tsrts_*/**/run.log
            /tmp/tsrts_*/**/*.json
          if-no-files-found: ignore
          retention-days: 14
